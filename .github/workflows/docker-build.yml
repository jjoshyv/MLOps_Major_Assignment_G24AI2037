name: Build & Test Docker Image

on:
  push:
    branches: [ docker_ci ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install system build deps (non-interactive)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            gcc g++ gfortran \
            pkg-config \
            python3-distutils \
            python3-dev \
            libopenblas-dev \
            liblapack-dev \
            libatlas-base-dev \
            libblas-dev \
            libffi-dev \
            libssl-dev \
            ca-certificates \
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip / setuptools / wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (prefer wheels)
        run: |
          # prefer binary wheels where available to avoid compiling
          python -m pip install --prefer-binary --no-cache-dir -r requirements.txt

      - name: Run unit tests
        run: python test.py

      - name: Build Docker image
        run: docker build -t mlops-olivetti-app .
