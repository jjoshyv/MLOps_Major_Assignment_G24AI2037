name: Build & Test Docker Image

on:
  push:
    branches: [ docker_ci ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install system build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          # try to install generic distutils + dev headers; fallback to python3-all-dev
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc g++ gfortran \
            pkg-config \
            python3-dev \
            python3-venv \
            python3-distutils \
            libopenblas-dev \
            liblapack-dev \
            libatlas-base-dev \
            libblas-dev \
            libffi-dev \
            libssl-dev || \
          sudo apt-get install -y --no-install-recommends python3-all-dev libopenblas-dev liblapack-dev libffi-dev libssl-dev



      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip / setuptools / wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (prefer wheels)
        run: |
          # prefer binary wheels where available to avoid compiling
          python -m pip install --prefer-binary --no-cache-dir -r requirements.txt

      - name: Train model
        run: |
          # run training (should save model to saved_models/savedmodel.pth)
          python train.py

      - name: Run unit tests
        run: |
          python test.py

      - name: Build Docker image
        run: docker build -t mlops-olivetti-app .
